[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbmtoolbox"
version = "0.1.0"
description = "Bayesian Generative Brain/Behavior Modelling in Python"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "GBM Toolbox contributors"}]
keywords = ["computational modeling", "bayesian", "behavior", "state-space", "laplace", "model selection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    # The inference core is built on JAX: jax.lax.scan likelihoods, AD Hessians
    # and float64 via jax_enable_x64 (set in __init__.py).
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
]

[project.optional-dependencies]
display = ["matplotlib>=3.6"]
dev = [
    "pytest>=7",
    "matplotlib>=3.6",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/ginobattistello/BayesGBM"
Repository = "https://github.com/ginobattistello/BayesGBM"
Issues = "https://github.com/ginobattistello/BayesGBM/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["gbmtoolbox*"]
# dev/ holds method-validation scripts for contributors and CI. They are kept
# in the repository but excluded from the wheel, so an install ships only the
# library and its runnable tutorials.
exclude = ["gbmtoolbox.dev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 160

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
# Kept deliberately:
#   B023  a loop-local list captured by an L-BFGS-B callback that SciPy calls
#         synchronously, so the closure always sees the intended list;
#   DTZ005 fit timestamps are local wall-clock provenance, not instants to
#         compare across machines;
#   C408  tuple() reads better than a bare () when returning an empty result.
ignore = ["B023", "DTZ005", "C408"]

[tool.ruff.lint.per-file-ignores]
# Tutorials and reference checks are numbered so they read in order. They are
# run as scripts, never imported, so the module-name rule does not apply.
"gbmtoolbox/examples/*.py" = ["N999"]
"gbmtoolbox/dev/*.py" = ["N999"]

[tool.ruff.lint.isort]
# Match the formatter's skip-magic-trailing-comma, so the two do not disagree
# about when an import list should be split over several lines.
split-on-trailing-comma = false